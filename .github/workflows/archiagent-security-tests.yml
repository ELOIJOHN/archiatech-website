name: ArchiAgent security tests
on:
  push:
    branches: [audit/securisation-archiagent]
  workflow_dispatch:
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests without provider credentials
        run: node --test backend/archiagent-server.test.mjs
