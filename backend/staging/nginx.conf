worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No conversation, query strings, credentials or client IPs in access logs.
    log_format safe '$status $request_method $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 20s;
    keepalive_timeout 5s;
    limit_req_zone $binary_remote_addr zone=client:1m rate=12r/m;
    limit_req_zone $server_name zone=global:1m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    map $http_origin $allowed_origin {
        default "";
        "https://localhost:18443" "https://localhost:18443";
    }
    map $status $retry_after { default ""; 429 "60"; }
    server {
        listen 8080 default_server;
        server_name localhost;
        # Fixed authority: never reflect an untrusted Host into a redirect.
        return 308 https://localhost:18443$request_uri;
    }
    server {
        listen 8443 ssl default_server;
        server_name localhost;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        add_header Access-Control-Allow-Origin $allowed_origin always;
        add_header Vary Origin always;
        add_header Retry-After $retry_after always;
        root /site;
        location = /api/archiagent {
            if ($allowed_origin = "") { return 403; }
            if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
            limit_req zone=client burst=11 nodelay;
            limit_req zone=global burst=19 nodelay;
            limit_req_status 429;
            limit_conn connections 8;
            limit_conn_status 429;
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Vary;
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Retry-After;
            # Stream bounded bodies: backend's absolute deadline also stops slow drips.
            proxy_request_buffering off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 20s;
            proxy_next_upstream off;
        }
        location /api/ { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
