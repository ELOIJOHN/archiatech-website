<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients pour l'effet futuriste -->
    <radialGradient id="backgroundGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="suitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f8f8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E60023;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0033;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="hologramGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bfff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#0080ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0.4" />
    </linearGradient>
    
    <!-- Filtres pour les effets lumineux -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="particleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Arrière-plan avec particules lumineuses -->
  <rect width="200" height="200" fill="url(#backgroundGradient)"/>
  
  <!-- Particules rouges en spirale -->
  <g filter="url(#particleGlow)">
    <circle cx="100" cy="100" r="1" fill="#E60023" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="1" fill="#ff0033" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="1" fill="#E60023" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="1" fill="#ff0033" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Particules dispersées -->
  <g opacity="0.7">
    <circle cx="50" cy="50" r="0.5" fill="#E60023">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80" r="0.5" fill="#ff0033">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="150" r="0.5" fill="#E60023">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="40" r="0.5" fill="#ff0033">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Corps du robot -->
  <g transform="translate(100, 100)">
    <!-- Tête -->
    <ellipse cx="0" cy="-30" rx="25" ry="30" fill="url(#robotGradient)" stroke="#E60023" stroke-width="2"/>
    
    <!-- Écouteurs/capteurs -->
    <ellipse cx="-20" cy="-25" rx="8" ry="12" fill="#000000" opacity="0.8"/>
    <ellipse cx="20" cy="-25" rx="8" ry="12" fill="#000000" opacity="0.8"/>
    
    <!-- Corps principal -->
    <rect x="-20" y="-5" width="40" height="60" rx="5" fill="url(#suitGradient)" stroke="#E60023" stroke-width="2"/>
    
    <!-- Col et revers rouges -->
    <rect x="-18" y="-5" width="36" height="8" fill="url(#redAccent)"/>
    <rect x="-20" y="-3" width="8" height="12" fill="url(#redAccent)"/>
    <rect x="12" y="-3" width="8" height="12" fill="url(#redAccent)"/>
    
    <!-- Cravate -->
    <rect x="-3" y="-5" width="6" height="25" fill="url(#redAccent)"/>
    <polygon points="-3,-5 3,-5 0,0" fill="url(#redAccent)"/>
    
    <!-- Pochette -->
    <rect x="8" y="5" width="8" height="12" fill="url(#redAccent)"/>
    
    <!-- Boutons -->
    <circle cx="0" cy="10" r="2" fill="#ffffff"/>
    <circle cx="0" cy="20" r="2" fill="#ffffff"/>
    <circle cx="0" cy="30" r="2" fill="#ffffff"/>
    
    <!-- Bras gauche (tendu) -->
    <ellipse cx="-35" cy="5" rx="8" ry="15" fill="url(#robotGradient)" stroke="#E60023" stroke-width="2"/>
    <ellipse cx="-45" cy="5" rx="6" ry="12" fill="url(#robotGradient)" stroke="#E60023" stroke-width="2"/>
    
    <!-- Main gauche avec hologramme -->
    <ellipse cx="-50" cy="5" rx="8" ry="6" fill="url(#robotGradient)" stroke="#E60023" stroke-width="2"/>
    
    <!-- Hologramme du visage -->
    <g transform="translate(-50, 5)">
      <ellipse cx="0" cy="0" rx="12" ry="15" fill="url(#hologramGradient)" opacity="0.7" filter="url(#glow)"/>
      <ellipse cx="-3" cy="-3" rx="2" ry="3" fill="#00bfff" opacity="0.9"/>
      <ellipse cx="3" cy="-3" rx="2" ry="3" fill="#00bfff" opacity="0.9"/>
      <path d="M -2,2 Q 0,4 2,2" stroke="#00bfff" stroke-width="1" fill="none" opacity="0.9"/>
      
      <!-- Éléments graphiques autour du visage -->
      <rect x="-8" y="-8" width="2" height="2" fill="#00bfff" opacity="0.6"/>
      <rect x="6" y="-8" width="2" height="2" fill="#00bfff" opacity="0.6"/>
      <rect x="-8" y="6" width="2" height="2" fill="#00bfff" opacity="0.6"/>
      <rect x="6" y="6" width="2" height="2" fill="#00bfff" opacity="0.6"/>
      
      <!-- Lignes de données -->
      <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#00bfff" stroke-width="0.5" opacity="0.5"/>
      <line x1="-6" y1="6" x2="6" y2="6" stroke="#00bfff" stroke-width="0.5" opacity="0.5"/>
    </g>
    
    <!-- Bras droit -->
    <ellipse cx="35" cy="5" rx="8" ry="15" fill="url(#robotGradient)" stroke="#E60023" stroke-width="2"/>
    <ellipse cx="45" cy="5" rx="6" ry="12" fill="url(#robotGradient)" stroke="#E60023" stroke-width="2"/>
    <ellipse cx="50" cy="5" rx="8" ry="6" fill="url(#robotGradient)" stroke="#E60023" stroke-width="2"/>
    
    <!-- Jambes -->
    <rect x="-15" y="55" width="12" height="25" rx="6" fill="url(#robotGradient)" stroke="#E60023" stroke-width="2"/>
    <rect x="3" y="55" width="12" height="25" rx="6" fill="url(#robotGradient)" stroke="#E60023" stroke-width="2"/>
    
    <!-- Pieds -->
    <ellipse cx="-9" cy="85" rx="8" ry="5" fill="url(#robotGradient)" stroke="#E60023" stroke-width="2"/>
    <ellipse cx="9" cy="85" rx="8" ry="5" fill="url(#robotGradient)" stroke="#E60023" stroke-width="2"/>
  </g>
  
  <!-- Lueur bleue derrière l'hologramme -->
  <ellipse cx="50" cy="105" rx="20" ry="25" fill="#00bfff" opacity="0.2" filter="url(#glow)">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Cadre circulaire blanc -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
</svg>
