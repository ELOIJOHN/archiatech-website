<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Mail Direct - ArchiAtech</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 50%, #ffffff 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(227, 64, 64, 0.12);
            border: 2px solid #e34040;
        }
        
        .test-title {
            color: #e34040;
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .test-button {
            background: #e34040;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0.5rem;
            width: 100%;
        }
        
        .test-button:hover {
            background: #c73636;
            transform: translateY(-2px);
        }
        
        .test-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        
        .result-box {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .result-success {
            background: #d1fae5;
            border: 2px solid #10b981;
            color: #065f46;
        }
        
        .result-error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
        }
        
        .result-info {
            background: #dbeafe;
            border: 2px solid #3b82f6;
            color: #1e40af;
        }
        
        .instructions {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
        }
        
        .instructions h3 {
            color: #92400e;
            margin: 0 0 0.5rem 0;
        }
        
        .instructions p {
            color: #92400e;
            margin: 0;
            font-size: 0.9rem;
        }
        
        .form-section {
            margin: 2rem 0;
            padding: 1.5rem;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #f9fafb;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #374151;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        
        .form-group textarea {
            height: 100px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 class="test-title">📧 Test Mail Direct - ArchiAtech</h1>
        
        <div class="instructions">
            <h3>🎯 Test Sans Onglets Google</h3>
            <p>Ce test utilise une méthode qui ne devrait PAS ouvrir d'onglet Google, mais directement votre application mail.</p>
        </div>
        
        <div class="form-section">
            <h3>📝 Formulaire de Test</h3>
            <form id="testForm">
                <div class="form-group">
                    <label>Nom complet :</label>
                    <input type="text" id="fullName" value="Jean Dupont" required>
                </div>
                
                <div class="form-group">
                    <label>Email :</label>
                    <input type="email" id="email" value="jean.dupont@test.com" required>
                </div>
                
                <div class="form-group">
                    <label>Société :</label>
                    <input type="text" id="company" value="Test Company">
                </div>
                
                <div class="form-group">
                    <label>Message :</label>
                    <textarea id="message" required>Ceci est un test du système mail sans ouverture d'onglet Google.</textarea>
                </div>
                
                <button type="submit" class="test-button">📧 Tester l'ouverture directe de l'application mail</button>
            </form>
            
            <div id="result" class="result-box" style="display: none;"></div>
        </div>
        
        <div class="form-section">
            <h3>🔧 Tests Rapides</h3>
            <button class="test-button" onclick="testSimpleMailto()">Test 1: mailto simple</button>
            <button class="test-button" onclick="testDirectLink()">Test 2: Lien direct</button>
            <button class="test-button" onclick="testLocationHref()">Test 3: window.location</button>
            <div id="quickResult" class="result-box" style="display: none;"></div>
        </div>
    </div>

    <script>
        function showResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = `result-box result-${type}`;
            element.textContent = message;
        }
        
        function testSimpleMailto() {
            showResult('quickResult', 'Test mailto simple...', 'info');
            
            try {
                // Méthode la plus simple possible
                window.location.href = 'mailto:contact@archiatech.com?subject=Test%20Simple&body=Test%20sans%20onglet%20Google';
                
                setTimeout(() => {
                    showResult('quickResult', '✅ Test simple exécuté. Vérifiez si votre application mail s\'est ouverte (pas d\'onglet Google).', 'success');
                }, 1000);
            } catch (error) {
                showResult('quickResult', `❌ Erreur: ${error.message}`, 'error');
            }
        }
        
        function testDirectLink() {
            showResult('quickResult', 'Test avec lien direct...', 'info');
            
            try {
                // Créer un lien et le cliquer SANS target="_blank"
                const link = document.createElement('a');
                link.href = 'mailto:contact@archiatech.com?subject=Test%20Direct&body=Test%20avec%20lien%20direct';
                link.style.display = 'none';
                // PAS de target="_blank" !
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => {
                    showResult('quickResult', '✅ Test direct exécuté. Vérifiez si votre application mail s\'est ouverte.', 'success');
                }, 1000);
            } catch (error) {
                showResult('quickResult', `❌ Erreur: ${error.message}`, 'error');
            }
        }
        
        function testLocationHref() {
            showResult('quickResult', 'Test avec window.location.href...', 'info');
            
            try {
                window.location.href = 'mailto:contact@archiatech.com?subject=Test%20Location&body=Test%20avec%20window.location';
                
                setTimeout(() => {
                    showResult('quickResult', '✅ Test location exécuté. Vérifiez si votre application mail s\'est ouverte.', 'success');
                }, 1000);
            } catch (error) {
                showResult('quickResult', `❌ Erreur: ${error.message}`, 'error');
            }
        }
        
        // Gestion du formulaire
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const company = document.getElementById('company').value;
            const message = document.getElementById('message').value;
            
            const emailSubject = `[TEST ArchiAtech] Demande de contact - ${fullName}`;
            const emailBody = `Bonjour,

Ceci est un TEST du système de contact ArchiAtech.

═══════════════════════════════════════
📋 INFORMATIONS DU CONTACT
═══════════════════════════════════════

👤 Nom complet : ${fullName}
📧 Email : ${email}
🏢 Société : ${company || 'Non renseignée'}

═══════════════════════════════════════
💬 MESSAGE
═══════════════════════════════════════

${message}

═══════════════════════════════════════
📅 Date du test : ${new Date().toLocaleString('fr-FR')}
🌐 Envoyé depuis : Site web ArchiAtech (TEST)
═══════════════════════════════════════

---
Pour répondre, utilisez directement l'adresse : ${email}`;
            
            const mailtoLink = `mailto:contact@archiatech.com?subject=${encodeURIComponent(emailSubject)}&body=${encodeURIComponent(emailBody)}`;
            
            showResult('result', 'Tentative d\'ouverture de votre application mail...', 'info');
            
            try {
                // Méthode qui ne devrait PAS ouvrir d'onglet Google
                const tempLink = document.createElement('a');
                tempLink.href = mailtoLink;
                tempLink.style.display = 'none';
                // PAS de target="_blank" !
                document.body.appendChild(tempLink);
                tempLink.click();
                document.body.removeChild(tempLink);
                
                setTimeout(() => {
                    showResult('result', '✅ Test du formulaire exécuté ! Vérifiez si votre application mail s\'est ouverte (pas d\'onglet Google).', 'success');
                }, 1000);
            } catch (error) {
                showResult('result', `❌ Erreur lors du test: ${error.message}`, 'error');
            }
        });
    </script>
</body>
</html>
