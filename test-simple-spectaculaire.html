<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple - Cadre Lumineux Spectaculaire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
        }
        
        .title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: #212529;
            margin-bottom: 40px;
        }
        
        .title .highlight {
            color: #E60023;
        }
        
        /* Styles pour le cadre lumineux spectaculaire */
        @keyframes glow-pulse {
            0% { 
              box-shadow: 
                0 0 20px rgba(230, 0, 35, 0.7),
                0 0 40px rgba(230, 0, 35, 0.5),
                0 0 80px rgba(230, 0, 35, 0.3),
                0 15px 50px rgba(0, 0, 0, 0.4);
              transform: scale(1);
            }
            50% { 
              box-shadow: 
                0 0 30px rgba(230, 0, 35, 1.2),
                0 0 60px rgba(230, 0, 35, 0.8),
                0 0 120px rgba(230, 0, 35, 0.5),
                0 15px 50px rgba(0, 0, 0, 0.6);
              transform: scale(1.02);
            }
            100% { 
              box-shadow: 
                0 0 20px rgba(230, 0, 35, 0.7),
                0 0 40px rgba(230, 0, 35, 0.5),
                0 0 80px rgba(230, 0, 35, 0.3),
                0 15px 50px rgba(0, 0, 0, 0.4);
              transform: scale(1);
            }
          }
          
          .video-container-spectacular {
            border: 4px solid #E60023;
            border-radius: 16px;
            position: relative;
            overflow: visible;
            z-index: 10;
            backdrop-filter: blur(2px);
            transition: all 0.3s ease;
            animation: glow-pulse 2.5s ease-in-out infinite;
            max-width: 100%;
            margin: 0 auto;
            background: #000;
          }
          
          .video-container-spectacular::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border: 2px solid rgba(255, 0, 0, 0.6);
            border-radius: 20px;
            z-index: -1;
          }
          
          .video-container-spectacular::after {
            content: '';
            position: absolute;
            top: -12px;
            left: -12px;
            right: -12px;
            bottom: -12px;
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 24px;
            z-index: -2;
          }
          
          .video-container-spectacular:hover {
            transform: scale(1.02);
            box-shadow: 
              0 0 30px rgba(230, 0, 35, 1.2),
              0 0 60px rgba(230, 0, 35, 0.8),
              0 0 120px rgba(230, 0, 35, 0.5),
              0 15px 50px rgba(0, 0, 0, 0.6);
          }
        
        .video-content {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, #111 0%, #333 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .play-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            background: #e34040;
            color: white;
            font-size: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(227, 64, 64, 0.8), 0 0 0 4px rgba(255, 255, 255, 0.3);
            z-index: 20;
        }
        
        .play-button:hover {
            transform: scale(1.1);
            background: #ff0000;
            box-shadow: 0 10px 40px rgba(227, 64, 64, 1), 0 0 0 6px rgba(255, 255, 255, 0.5);
        }
        
        .status-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 12px;
            height: 12px;
            background-color: #ff0000;
            border-radius: 50%;
            z-index: 20;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .sound-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffffff;
            border-radius: 50%;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        
        .sound-button:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
        }
        
        .video-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
        }
        
        .description {
            text-align: center;
            margin-top: 30px;
            color: #6c757d;
            font-size: 1.1rem;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid rgba(230, 0, 35, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">
            Test <span class="highlight">Cadre Lumineux Spectaculaire</span>
        </h1>
        
        <!-- Lecteur Vidéo avec Cadre Lumineux Spectaculaire -->
        <div class="video-container-spectacular">
            <div class="video-content">
                <div class="play-button">▶️</div>
                <div class="status-indicator"></div>
                <div class="sound-button">🔊</div>
                <div class="video-label">Support IT</div>
            </div>
        </div>
        
        <div class="description">
            <p><strong>✨ Si vous voyez ce cadre rouge lumineux qui pulse, l'effet fonctionne !</strong></p>
            <p>• Bordure rouge de 4px avec bordures secondaires</p>
            <p>• Ombre lumineuse avec 4 couches d'effets néon</p>
            <p>• Animation pulsante de 2.5s</p>
            <p>• Effet de scale au hover</p>
        </div>
    </div>
</body>
</html>
